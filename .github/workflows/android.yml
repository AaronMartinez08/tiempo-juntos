name: Compilar Android (APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Generar el proyecto nativo de Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copiar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TiempoJuntos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TiempoJuntos-Android-APK
          path: TiempoJuntos.apk
